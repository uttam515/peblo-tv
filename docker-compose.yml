services:
  db:
    image: postgres:16-alpine
    container_name: peblo_tv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-peblo_tv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: peblo_tv_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/peblo_tv}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - ./storage:/app/storage

  cms:
    build: ./cms
    container_name: peblo_tv_cms
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-3000}:80"
    depends_on:
      - api

  viewer:
    build: ./viewer
    container_name: peblo_tv_viewer
    restart: unless-stopped
    ports:
      - "${VIEWER_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  postgres_data:
